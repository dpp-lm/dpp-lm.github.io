<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><title>Social card</title>
<link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/w-hero.css">
<style>
html,body{margin:0;background:var(--bg);font-family:var(--font);color:var(--ink)}
.card{width:1200px;height:630px;box-sizing:border-box;padding:64px 72px;display:grid;grid-template-columns:1fr 470px;gap:40px;align-items:center}
.v{color:var(--accent);font-weight:600;font-size:26px;margin:0 0 18px}
h1{font-family:var(--font-serif);font-size:64px;line-height:1.08;margin:0 0 28px;font-weight:600}
.a{font-size:25px;color:var(--ink-2);line-height:1.45;margin:0}
.u{font-size:24px;color:var(--ink-3);margin:26px 0 0}
.fig{transform:scale(1.12);transform-origin:center}
.fig .wh-caption,.fig button{display:none !important}
</style></head><body>
<div class="card"><div>
<p class="v">NeurIPS 2026</p>
<h1>A Model of Diverse Sampling from Language Models</h1>
<p class="a">Manuel Prada-Corral, Yahya Emara, Timothy J. O'Donnell, Ryan Cotterell, Tim Vieira</p>
<p class="u">dpp-lm.github.io</p>
</div><div class="fig"><div class="widget" id="h"></div></div></div>
<script type="module">import {mount} from '../js/w-hero.js'; mount(document.getElementById('h'));</script>
</body></html>
